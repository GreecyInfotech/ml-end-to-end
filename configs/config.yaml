project:
  name: vessel-delay-prediction
  version: "2.1.0"
  feature_version: "v2"

data:
  raw_path: data/raw/vessels.csv
  reference_path: data/raw/vessels.csv

model:
  target: delayed
  test_size: 0.20
  random_state: 42
  cv_folds: 5
  decision_threshold: 0.50

business:
  false_positive_cost: 1.0
  false_negative_cost: 5.0

promotion_gate:
  min_recall: 0.85
  max_p95_latency_ms: 200.0

mlflow:
  enabled: true
  experiment_name: vessel-delay-prediction
  registered_model_name: vessel-delay-classifier
  production_alias: champion
  tracking_uri: sqlite:///mlruns/mlflow.db
  registry_uri: sqlite:///mlruns/mlflow.db

models:
  logistic_regression:
    max_iter: 1000
  random_forest:
    n_estimators: 250
    max_depth: 10
    min_samples_leaf: 1
    max_features: sqrt
    random_state: 42
  xgboost:
    n_estimators: 250
    max_depth: 6
    learning_rate: 0.05
    min_child_weight: 1
    subsample: 1.0
    colsample_bytree: 1.0
    reg_lambda: 1.0
    scale_pos_weight: 1.0
    tree_method: hist
    random_state: 42

drift:
  psi_medium: 0.10
  psi_high: 0.25
  missing_medium: 0.10
  missing_high: 0.25
